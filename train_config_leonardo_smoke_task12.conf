# 200-step single-GPU gate for the 2026-09-16 contract (dataset draftvla/task12_tactile_train).
# Acceptance (contract §H): loss_dist falls, g_phy_rel nonzero (~0.3 at init), proto_entropy not
# pinned at log(6)=1.792, phy_alpha logged.
MODE=task12
# --- FVLMoE ---
NUM_EXPERTS=4
NUM_HEADS=8
MLP_RATIO=1.0
# --- Physical Interaction Token (2026-09-16 contract) ---
PHY_DIM=128
NUM_PROTOTYPES=6       # K=6, must match soft_prototype_target width in draftvla/task12_tactile_*
LAMBDA_DIST=1.0
LAMBDA_PROTO=0.05
PROTO_RAMP_START=1000  # contract §0c: ramp moved earlier, 1k -> 3k
PROTO_RAMP_STEPS=2000
PHY_ACTION_GAIN_INIT=13   # contract §0c; drop to 5-8 if loss_flow is clearly worse than the
                          # forcevla baseline (~0.028) in the first ~500 steps
# --- Optimization ---
PEAK_LR=2.5e-5
DECAY_LR=2.5e-6
CLIP_GRAD_NORM=1.0
# --- Hardware ---
GPUS=
FSDP_DEVICES=1
LOG_INTERVAL=10
BATCH_SIZE=16
NUM_TRAIN_STEPS=200
WARMUP_STEPS=20        # MUST stay << NUM_TRAIN_STEPS (the old smoke's warmup=1000 > 200 pinned the LR)
DECAY_STEPS=200
EXP_NAME=task12_smoke
LOG_INTERVAL=1
