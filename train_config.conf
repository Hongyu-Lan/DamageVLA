# ============================================================================
# DraftVLA / Force-aware pi0 -- training configuration.
#
# Launch:   bash run_train.sh
#
# Plain shell file (KEY=VALUE, no spaces around =), `source`d by run_train.sh and
# run_smoke_with_config.sh, which turn these into a config name + CLI overrides
# for scripts/train.py.
#
# While training, every loss is logged each LOG_INTERVAL steps to:
#   - TensorBoard : tensorboard --logdir checkpoints/<config>/<EXP_NAME>/tensorboard
#   - CSV         : checkpoints/<config>/<EXP_NAME>/metrics.csv
#   - console
# At the end, a diagnostic summary is printed and written to:
#   - checkpoints/<config>/<EXP_NAME>/training_summary.txt
# Send that file (or metrics.csv) back to analyze a z_phy / L_dist / L_proto failure.
#
# Spec: outlines/draftvla_plan.md (v2.1). Section refs point into it.
# ============================================================================

# --- Training mode (the biggest knob) ---------------------------------------
# DraftVLA (Damage-Aware ForceVLA) -- dataset draftvla/fruits_tactile:
#   draftvla           = FVLMoE + Physical Interaction Token z_phy    -> pi0_draftvla
#                        (L_flow + lambda_dist*L_dist + lambda_proto*L_proto)
#   draftvla_forcevla  = ablation `forcevla`: physical branch OFF     -> pi0_draftvla_forcevla
#   draftvla_noforce   = ablation `no-force`: vanilla pi0             -> pi0_draftvla_noforce
#
# Legacy force-aware pi0 -- dataset force/banana:
#   fvlmoe  = M2, ForceVLA FVLMoE late fusion     -> pi0_force_fvlmoe
#   token   = M1, force as one conditioning token -> pi0_force_token
#   vanilla = no force, baseline ablation         -> pi0_force_baseline
#
# Each mode is a distinct registered config (own weight back-fill + freeze
# filter), so the mode selects the config name -- it is NOT just a CLI flag.
MODE=draftvla

# --- FVLMoE hyperparameters (used by fvlmoe / draftvla / draftvla_forcevla) --
NUM_EXPERTS=4          # sparse top-1 experts; ForceVLA Table 4 default = 4
NUM_HEADS=8            # FVLMoE self-attention heads
MLP_RATIO=1.0          # FVLMoE FFN expansion ratio

# --- Physical Interaction Token (MODE=draftvla only) ------------------------
PHY_DIM=128            # z_phy dimension (plan rule 12)
NUM_PROTOTYPES=4       # K; must match the soft_prototype_target width in the data
LAMBDA_DIST=1.0        # weight on the safe-distribution KL (plan §7.5)
LAMBDA_PROTO=0.05      # weight on the soft-prototype CE (plan §7.5)
# Phase schedule (plan §7.5): phase 1 trains L_flow + L_dist alone, then
# lambda_proto ramps linearly 0 -> LAMBDA_PROTO between START and START+STEPS.
# Set PROTO_RAMP_STEPS=0 for a constant LAMBDA_PROTO from step 0 (no ramp).
PROTO_RAMP_START=4000  # phase 2 begins at step 4k
PROTO_RAMP_STEPS=4000  # reaches full LAMBDA_PROTO at step 8k

# --- Optimization -----------------------------------------------------------
# BATCH_SIZE: this is the GLOBAL batch, and it is the knob that decides whether
#   L_dist/L_proto can learn at all. After excluding the 4 failed episodes, ~56%
#   of frames carry physical labels (9,534 / 16,904), so labeled frames per step
#   are approximately 0.56 * BATCH_SIZE:
#       batch  4 -> ~2.3 labeled/step   <- smoke only; KL remains noisy
#       batch 16 -> ~9.0 labeled/step   <- current single-A100 global batch
#       batch 24 -> ~13.5 labeled/step
#       batch 32 -> ~18.0 labeled/step
#   On the single-A100 full job, the one GPU processes the full global batch of 16.
#   If this OOMs on a smaller GPU, step down 16 -> 8. It is the first thing
#   to lower, and `training_summary.txt` reports the labeled-frames/step it
#   actually saw plus a LABEL STARVATION finding if it was too low.
BATCH_SIZE=16
NUM_TRAIN_STEPS=10000
PEAK_LR=2.5e-5         # cosine-decay peak learning rate
# WARMUP_STEPS *must* stay well below NUM_TRAIN_STEPS. The 200-step smoke ran
# with warmup=1000 > steps=200, so the LR never exceeded 20% of peak (5e-6): the
# pretrained flow head still fine-tuned, but the freshly-initialized phy_* heads
# barely moved and L_proto sat pinned at log(4)=1.386 (a uniform classifier).
# The summary emits an explicit finding if the LR never reaches a sane value.
WARMUP_STEPS=1000
DECAY_STEPS=10000      # cosine-decay horizon; keep >= NUM_TRAIN_STEPS
DECAY_LR=2.5e-6        # final (end) learning rate
CLIP_GRAD_NORM=1.0     # gradient-norm clip

# --- Hardware ---------------------------------------------------------------
# GPUS: explicit nvidia-smi indices for a workstation, e.g. "1" or "0,1".
#   Inside a Slurm job this value is ignored and the scheduler's CUDA_VISIBLE_DEVICES
#   assignment is used verbatim.
#   Leave EMPTY to auto-pick a display-free GPU -- but on this box `select_gpu.py`
#   sees a display on BOTH GPUs (X enumerates each device) and refuses to pick.
#   GPU 0 drives the desktop (gnome-shell/browser, ~20 GB used); GPU 1 has only a
#   bare Xorg at ~272 MiB and is the one to train on.
# WARNING: JAX uses EVERY visible GPU; the count comes from CUDA_VISIBLE_DEVICES,
#          NOT from FSDP_DEVICES. The Slurm full job requests one GPU.
GPUS=
# With the single-A100 full job, 1 gives a (data=1, fsdp=1) mesh. The optional
# smoke4 gate still gives (data=4, fsdp=1), i.e. four-way data parallelism.
FSDP_DEVICES=1

# --- Bookkeeping ------------------------------------------------------------
EXP_NAME=draftvla_full     # checkpoints/<config>/<EXP_NAME>/
# LOG_INTERVAL: metrics are averaged over the interval before logging, so >1 also
# denoises the curves. 10 gives 1000 rows over 10k steps -- plenty to diagnose.
LOG_INTERVAL=10

# ============================================================================
# NOTE before a real run -- label leakage (plan §4.3.1)
# ============================================================================
# The shipped per-frame labels (and pi0_draftvla's phy_label_mean/scale defaults)
# were computed over ALL 22 successful contributing episodes, so they leak any
# validation split you later hold out. For a reported train/validation experiment,
# first choose validation episodes stratified by fruit, rebuild labels from the
# training episodes only, and re-convert. The quick full-data training path does
# not define a validation split.
#
#   uv run examples/force/build_safe_group_prototypes.py \
#       --data-dir ../DamageVLA_training_post_process_20260821 \
#       --val-episodes <potato-validation-episode> \
#       --val-episodes <pear-validation-episode> \
#       --val-episodes <banana-validation-episode> \
#       --tau-q 0.1 --output-dir prototype_metadata_trainonly --write
#   uv run examples/force/convert_draftvla_data_to_lerobot.py \
#       --labels-dir prototype_metadata_trainonly --repo-id draftvla/fruits_trainonly
#
# Then point the config's repo_id at it. Heads-up: the train-only rebuild
# RE-PARTITIONS the prototypes (potato collapses, pear splits by phase), so the
# cluster table in plan §4.2 describes the shipped labels, not those.
# ============================================================================
