# 200-step gate for ablation B1 architecture-only (outlines/todo_ablation_switches.md §5).
# Identical to train_config_leonardo_smoke_task12_v2.conf except MODE/EXP_NAME and the two lambdas.
# Acceptance (todo_ablation_switches.md §5): loss_flow same order as full; loss_dist does NOT
# fall (it has no gradient); g_phy_rel nonzero. If loss_dist falls, the lambdas did not take --
# check the --model.lambda-dist the launcher prints.
MODE=task12_v2_archonly
DATASET_REPO_ID=draftvla/task12_tactile_train_v2
VAL_DATASET_REPO_ID=draftvla/task12_tactile_val_v2
# --- FVLMoE ---
NUM_EXPERTS=4
NUM_HEADS=8
MLP_RATIO=1.0
# --- Physical Interaction Token (2026-09-16 contract) ---
PHY_DIM=128
NUM_PROTOTYPES=6       # K=6, must match soft_prototype_target width in draftvla/task12_tactile_*
LAMBDA_DIST=0                # B1: physical supervision OFF
LAMBDA_PROTO=0               # B1: physical supervision OFF
PROTO_RAMP_START=1000  # contract §0c: ramp moved earlier, 1k -> 3k
PROTO_RAMP_STEPS=2000
PHY_ACTION_GAIN_INIT=13   # contract §0c; drop to 5-8 if loss_flow is clearly worse than the
                          # forcevla baseline (~0.028) in the first ~500 steps
# --- Optimization ---
PEAK_LR=2.5e-5
DECAY_LR=2.5e-6
CLIP_GRAD_NORM=1.0
# --- Hardware ---
GPUS=
FSDP_DEVICES=1
LOG_INTERVAL=10
BATCH_SIZE=16
NUM_TRAIN_STEPS=200
WARMUP_STEPS=20        # MUST stay << NUM_TRAIN_STEPS (the old smoke's warmup=1000 > 200 pinned the LR)
DECAY_STEPS=200
EXP_NAME=task12_v2_archonly_smoke
LOG_INTERVAL=1
