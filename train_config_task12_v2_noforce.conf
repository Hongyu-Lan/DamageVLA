# Baseline arm on the v2 data: vanilla pi0, no force input (pi0_draftvla_task12_v2_noforce).
# Identical to train_config_task12_noforce.conf except MODE / dataset / EXP_NAME -- see train_config_task12_v2.conf.
MODE=task12_v2_noforce
DATASET_REPO_ID=draftvla/task12_tactile_train_v2
VAL_DATASET_REPO_ID=draftvla/task12_tactile_val_v2
# --- FVLMoE ---
NUM_EXPERTS=4
NUM_HEADS=8
MLP_RATIO=1.0
# --- Physical Interaction Token (2026-09-16 contract) ---
PHY_DIM=128
NUM_PROTOTYPES=6       # K=6, must match soft_prototype_target width in draftvla/task12_tactile_*
LAMBDA_DIST=1.0
LAMBDA_PROTO=0.05
PROTO_RAMP_START=1000  # contract §0c: ramp moved earlier, 1k -> 3k
PROTO_RAMP_STEPS=2000
PHY_ACTION_GAIN_INIT=13   # contract §0c; drop to 5-8 if loss_flow is clearly worse than the
                          # forcevla baseline (~0.028) in the first ~500 steps
# --- Optimization ---
PEAK_LR=2.5e-5
DECAY_LR=2.5e-6
CLIP_GRAD_NORM=1.0
# --- Hardware ---
GPUS=
FSDP_DEVICES=1
LOG_INTERVAL=10
BATCH_SIZE=16
NUM_TRAIN_STEPS=10000
WARMUP_STEPS=1000
DECAY_STEPS=10000
EXP_NAME=task12_v2_noforce_full
